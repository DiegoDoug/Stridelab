name: workflow-architecture-validation

# Documentation-phase verification for the StrideLab Workflow Architecture (Phase 01).
# Scope: structural consistency of the workflow-architecture documents only.
# Broader application CI remains Department 05's to define.

on:
  pull_request:
    paths:
      - "docs/product/**"
      - "stridelab-ai/knowledge/workflows/**"
      - "stridelab-ai/application-map/**"
      - "stridelab-ai/registry/**"
      - "stridelab-ai/project-memory/current-state/**"
      - "stridelab-ai/orchestration/**"
      - "stridelab-ai/scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/workflow-architecture-validation.yml"
  push:
    branches: [main]
    paths:
      - "docs/product/**"
      - "stridelab-ai/knowledge/workflows/**"
      - "stridelab-ai/application-map/**"
      - "stridelab-ai/registry/**"
      - "stridelab-ai/project-memory/current-state/**"
      - "stridelab-ai/orchestration/**"
      - "stridelab-ai/scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/workflow-architecture-validation.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (supply-chain hardening); comment = tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      # Dev dependencies only (the `yaml` parser the validator uses).
      # --ignore-scripts: no package lifecycle scripts execute during install.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run ai:validate (the real npm entry point)
        run: npm run ai:validate

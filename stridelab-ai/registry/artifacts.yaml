      One governed MVP release scope + an ordered implementation sequence
      (INC-0..INC-11, dependency-ordered not effort-ordered). Defines the MVP
      objective; target users + supported roles; supported devices/platforms
      (iOS/iPadOS; web client out of scope); included / conditional / deferred /
      excluded capabilities (referencing Phase A feature IDs); 11 end-to-end
      release journeys (J-1..J-11) exercising all 16 invariants + baseline §6A;
      required aggregates (A1-A35), bounded contexts, and the 14 cross-context
      contract seams; authorization / tenant-isolation / privacy / youth-safety /
      media / Vault / offline / accessibility / data-lifecycle requirements; the
      one independently-deployable workload (services/media-worker); a
      per-capability definition-of-done acceptance table; gate entry/exit
      criteria + the definition of MVP completion; the full cross-department
      review; the open-questions register; and the G7 decision package.
      Cross-department review (8 lenses: D01-D06 + architecture-reviewer +
      cross-department-reviewer): all PASS WITH CONDITIONS. Three BLOCKING
      findings raised and remediated in-artifact, affected reviews re-run and
      closed — D04-B1 (safety spine sequenced after media/messaging with no hard
      exposure gate → hard release gate added: INC-9 + D04 G3 sign-off before any
      external exposure of INC-5..INC-8), D04-B2 (S-08 preservation-hold
